<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <title>绿岛 Green Island</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    .logo {
      width: 180px;
      height: 180px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: #17b17a;
    }
    .subtitle {
      margin-top: 10px;
      font-size: 16px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/icon-512.png" alt="Green Island Logo">
    <div class="title">绿岛 Green Island</div>
    <div class="subtitle">Loading...</div>
  </div>

  <script>
    setTimeout(function () {
      window.location.href = "https://greenislandcommunity.com/login.html";
    }, 1500); // 延迟 1.5 秒跳转到登录页
  </script>
</body>

</html>
